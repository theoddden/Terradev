[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "terradev-dag-executor"
version = "0.1.0"
description = "Rust-backed parallel DAG executor for Terradev"
requires-python = ">=3.9"

[tool.maturin]
module-name = "terradev_dag_executor"
python-packages = []
features = ["pyo3/extension-module"]
