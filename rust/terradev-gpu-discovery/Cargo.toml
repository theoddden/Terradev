[package]
name = "terradev-gpu-discovery"
version = "0.1.0"
edition = "2021"

[lib]
name = "terradev_gpu_discovery"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
nvidia = { version = "0.6", optional = true }
pci-ids = "0.3"

[features]
default = ["nvml"]
nvml = ["nvidia"]
