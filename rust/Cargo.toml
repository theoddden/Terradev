[workspace]
members = [
    "terradev-state-machine",
    "terradev-resource-pool",
    "terradev-distributed-lock",
    "terradev-telemetry",
    "terradev-connection-pool",
    "terradev-event-bus",
    "terradev-cache-eviction",
    "terradev-snapshot-manager",
    "terradev-egress-optimizer",
    "terradev-gpu-topology",
    "terradev-authentication",
    "terradev-vram-estimator",
    "terradev-cost-calculator",
    "terradev-credential-vault",
    "terradev-config-validator",
    "terradev-artifact-verification",
    "terradev-quota-manager",
    "terradev-mcp-optimizer",
    "terradev-command-executor",
    "terradev-gpu-discovery",
    "terradev-dag-executor",
    "terradev-price-intelligence",
    "terradev-cost-scaler",
    "terradev-semantic-router",
    "terradev-warm-pool",
    "terradev-mcp-codec",
    "terradev-tool-registry",
    "terradev-result-compressor",
    "terradev-governance",
    "terradev-helm-generator",
]

[workspace.dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
crossbeam = "0.8"
parking_lot = "0.12"
deadpool = "0.12"
reqwest = { version = "0.11", features = ["json"] }
hdrhistogram = "7.5"
moka = { version = "0.12", features = ["sync"] }
zstd = "0.13"
bincode = "1.3"
backoff = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
petgraph = "0.6"
priority-queue = "1.3"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
percent-encoding = "2.3"
hex = "0.4"
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }
rust_decimal = "1.33"
zeroize = "1.7"
jsonschema = "0.17"
simd-json = "0.13"
lz4 = "1.24"
tera = "1.19"
phf = { version = "0.11", features = ["macros"] }
num_cpus = "1.16"
