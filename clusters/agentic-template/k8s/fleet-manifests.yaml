---
# Agent Fleet Kubernetes Manifests
# Three-tier heterogeneous GPU fleet for multi-agent LLM workloads.
# Generated by: terradev agent deploy --topology ./agent-fleet.yaml
#
# Tiers:
#   Namespace: agent-fleet
#   reasoning-svc  — H100 SXM, vLLM with prefix caching (port 8000)
#   decode-svc     — A100 80GB TP=2, high-throughput decode (port 8001)
#   cpu-tools-svc  — 48-vCPU, tool execution runner (port 9000)
#   router-svc     — KV prefix-aware request router (port 8080)

apiVersion: v1
kind: Namespace
metadata:
  name: agent-fleet
  labels:
    terradev.ai/managed: "true"
    terradev.ai/feature: agentic-provisioning

---
# ── REASONING TIER ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reasoning-tier
  namespace: agent-fleet
  labels:
    app: reasoning-tier
    terradev.ai/tier: reasoning
    terradev.ai/role: kv_preservation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reasoning-tier
  template:
    metadata:
      labels:
        app: reasoning-tier
        terradev.ai/tier: reasoning
      annotations:
    spec:
      nodeSelector:
        terradev.ai/tier: reasoning
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # NUMA topology: single-numa-node policy ensures GPU and NIC share NUMA node
      # (30-50% bandwidth improvement — applied by existing NUMA topology engine)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: reasoning-tier
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          ports:
            - containerPort: 8000
              name: inference
          env:
            - name: MODEL
              value: "meta-llama/Llama-3.1-70B-Instruct"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            # KV cache preservation — CRITICAL per arXiv:2605.26297
            - name: VLLM_ENABLE_PREFIX_CACHING
              value: "1"
            # Sleep mode: 18-200x faster cold-start than restart
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
            - --model=$(MODEL)
            - --tensor-parallel-size=1
            - --max-model-len=120000
            - --gpu-memory-utilization=0.90
            - --enable-prefix-caching        # 84-99% KV hit rate — must be ON
            - --kv-connector=offloading      # CPU offload under pressure
            - --speculative-config={"method":"mtp"}
            - --enable-sleep-mode
            - --max-num-seqs=8
            - --port=8000
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "200Gi"
              cpu: "16"
            requests:
              nvidia.com/gpu: "1"
              memory: "180Gi"
              cpu: "12"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 15
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-weights-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: reasoning-svc
  namespace: agent-fleet
  labels:
    app: reasoning-tier
    terradev.ai/tier: reasoning
spec:
  selector:
    app: reasoning-tier
  ports:
    - name: inference
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reasoning-hpa
  namespace: agent-fleet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reasoning-tier
  minReplicas: 1
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # 5 min cooldown — protect KV cache
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    # Scale on TTFT, NOT GPU utilization — bursty agentic workloads make
    # GPU util a misleading signal (arXiv:2605.26297)
    - type: External
      external:
        metric:
          name: vllm_request_ttft_seconds
          selector:
            matchLabels:
              app: reasoning-tier
        target:
          type: Value
          value: "2000m"   # 2000ms = 2s TTFT threshold

---
# ── DECODE TIER ───────────────────────────────────────────────────────────────
# Memory-bandwidth-optimised. A100 SXM 80GB: 2 TB/s HBM2e.
# TP=2 for 70B model — 140GB weights across two 80GB cards.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode-tier
  namespace: agent-fleet
  labels:
    app: decode-tier
    terradev.ai/tier: decode
    terradev.ai/role: decode_throughput
spec:
  replicas: 4
  selector:
    matchLabels:
      app: decode-tier
  template:
    metadata:
      labels:
        app: decode-tier
        terradev.ai/tier: decode
      annotations:
    spec:
      nodeSelector:
        terradev.ai/tier: decode
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          ports:
            - containerPort: 8001
              name: inference
          env:
            - name: MODEL
              value: "meta-llama/Llama-3.1-70B-Instruct"
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
            - --model=$(MODEL)
            - --tensor-parallel-size=2        # TP=2 for 70B
            - --max-model-len=120000
            - --gpu-memory-utilization=0.90
            - --enable-prefix-caching
            - --kv-connector=offloading
            - --speculative-config={"method":"mtp"}
            - --enable-sleep-mode
            - --max-num-seqs=16              # higher concurrency than reasoning tier
            - --port=8001
            - --disable-log-requests=false
          resources:
            limits:
              nvidia.com/gpu: "2"
              memory: "400Gi"
              cpu: "16"
            requests:
              nvidia.com/gpu: "2"
              memory: "350Gi"
              cpu: "12"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8001
            initialDelaySeconds: 90
            periodSeconds: 15
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-weights-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: decode-svc
  namespace: agent-fleet
  labels:
    app: decode-tier
    terradev.ai/tier: decode
spec:
  selector:
    app: decode-tier
  ports:
    - name: inference
      port: 8001
      targetPort: 8001
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: decode-hpa
  namespace: agent-fleet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: decode-tier
  minReplicas: 1
  maxReplicas: 32
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 90
      policies:
        - type: Pods
          value: 2
          periodSeconds: 90
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
  metrics:
    # Scale on decode queue depth — waiting requests is the correct signal
    # for bursty multi-agent workloads (not CPU/GPU utilization)
    - type: External
      external:
        metric:
          name: vllm_num_requests_waiting
          selector:
            matchLabels:
              app: decode-tier
        target:
          type: Value
          value: "6"

---
# ── CPU TOOLS TIER ────────────────────────────────────────────────────────────
# Bash, WebFetch, Read/Edit/Grep, code execution.
# Research: tools = 2-29% of runtime. GAIA (retrieval) hits 25-29%.
# 48 vCPU enables high parallel tool call fan-out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-tools-tier
  namespace: agent-fleet
  labels:
    app: cpu-tools-tier
    terradev.ai/tier: cpu-tools
    terradev.ai/role: cpu_io
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpu-tools-tier
  template:
    metadata:
      labels:
        app: cpu-tools-tier
        terradev.ai/tier: cpu-tools
      annotations:
    spec:
      nodeSelector:
        terradev.ai/tier: cpu-tools
      containers:
        - name: tool-runner
          image: terradev/agent-tool-runner:latest
          ports:
            - containerPort: 9000
              name: tools
          env:
            - name: MAX_CONCURRENT_TOOLS
              value: "64"
            - name: BASH_TIMEOUT_S
              value: "30"
            - name: WEBFETCH_TIMEOUT_S
              value: "15"
            - name: TOOL_QUEUE_DEPTH_WARN
              value: "8"
          resources:
            limits:
              memory: "96Gi"
              cpu: "48"
            requests:
              memory: "64Gi"
              cpu: "32"
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: cpu-tools-svc
  namespace: agent-fleet
  labels:
    app: cpu-tools-tier
    terradev.ai/tier: cpu-tools
spec:
  selector:
    app: cpu-tools-tier
  ports:
    - name: tools
      port: 9000
      targetPort: 9000
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-tools-hpa
  namespace: agent-fleet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-tools-tier
  minReplicas: 1
  maxReplicas: 16
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30
    scaleUp:
      stabilizationWindowSeconds: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: External
      external:
        metric:
          name: agent_tool_execution_latency_p95_ms
        target:
          type: Value
          value: "400"

---
# ── NETWORK POLICIES ──────────────────────────────────────────────────────────
# Enforce inter-tier routing rules.
# Only the router can talk to reasoning + decode tiers.
# CPU tools only expose results back to router.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reasoning-tier-netpol
  namespace: agent-fleet
spec:
  podSelector:
    matchLabels:
      terradev.ai/tier: reasoning
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: inference-router
      ports:
        - port: 8000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: decode-tier-netpol
  namespace: agent-fleet
spec:
  podSelector:
    matchLabels:
      terradev.ai/tier: decode
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: inference-router
      ports:
        - port: 8001

---
# ── INFERENCE ROUTER ──────────────────────────────────────────────────────────
# KV prefix-aware routing across reasoning and decode tiers.
# Routes by X-Agent-Id header for sticky routing (preserves KV residency).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-router
  namespace: agent-fleet
  labels:
    app: inference-router
    terradev.ai/role: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-router
  template:
    metadata:
      labels:
        app: inference-router
    spec:
      containers:
        - name: router
          image: terradev/inference-router:latest
          ports:
            - containerPort: 8080
          env:
            - name: REASONING_ENDPOINT
              value: "http://reasoning-svc:8000"
            - name: DECODE_ENDPOINT
              value: "http://decode-svc:8001"
            - name: PREFIX_CACHE_ENABLED
              value: "true"
            - name: PREFIX_CACHE_MAX_ENTRIES
              value: "10000"
            - name: STICKY_ROUTING_HEADER
              value: "X-Agent-Id"
          resources:
            limits:
              memory: "4Gi"
              cpu: "4"
            requests:
              memory: "2Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: router-svc
  namespace: agent-fleet
  labels:
    app: inference-router
spec:
  selector:
    app: inference-router
  ports:
    - name: router
      port: 8080
      targetPort: 8080
  type: LoadBalancer

---
# ── SHARED MODEL WEIGHTS PVC ──────────────────────────────────────────────────
# Both reasoning and decode tiers read from the same cached weights volume.
# Avoids redundant model downloads per pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-weights-pvc
  namespace: agent-fleet
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: efs-sc    # EFS for ReadOnlyMany (GCS Filestore on GKE)
  resources:
    requests:
      storage: 500Gi

---
# ── KARPENTER NODE POOLS ──────────────────────────────────────────────────────
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: reasoning-pool
  labels:
    terradev.ai/tier: reasoning
spec:
  template:
    metadata:
      labels:
        terradev.ai/tier: reasoning
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1
        kind: EC2NodeClass
        name: gpu-nodeclass
      requirements:
        - key: karpenter.sh/nodepool
          operator: In
          values: [reasoning-pool]
        - key: karpenter.azure.com/sku-name
          operator: In
          values: [p4d.24xlarge, p4de.24xlarge]    # H100 SXM instances
        - key: kubernetes.io/os
          operator: In
          values: [linux]
      kubelet:
        topologyManagerPolicy: single-numa-node   # NUMA alignment (30-50% bandwidth gain)
        cpuManagerPolicy: static
  limits:
    nvidia.com/gpu: "16"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 300s   # 5-minute cooldown to protect KV cache

---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: decode-pool
  labels:
    terradev.ai/tier: decode
spec:
  template:
    metadata:
      labels:
        terradev.ai/tier: decode
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1
        kind: EC2NodeClass
        name: gpu-nodeclass
      requirements:
        - key: karpenter.sh/nodepool
          operator: In
          values: [decode-pool]
        - key: karpenter.azure.com/sku-name
          operator: In
          values: [p3.8xlarge, p3.16xlarge, p3dn.24xlarge]   # A100 80GB instances
        - key: kubernetes.io/os
          operator: In
          values: [linux]
      kubelet:
        topologyManagerPolicy: single-numa-node
        cpuManagerPolicy: static
  limits:
    nvidia.com/gpu: "64"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 90s

---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cpu-tools-pool
  labels:
    terradev.ai/tier: cpu-tools
spec:
  template:
    metadata:
      labels:
        terradev.ai/tier: cpu-tools
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1
        kind: EC2NodeClass
        name: cpu-nodeclass
      requirements:
        - key: karpenter.sh/nodepool
          operator: In
          values: [cpu-tools-pool]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [c5.12xlarge, c5.24xlarge, c6i.12xlarge]   # 48+ vCPU, no GPU
        - key: kubernetes.io/os
          operator: In
          values: [linux]
  limits:
    cpu: "384"
  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 30s
