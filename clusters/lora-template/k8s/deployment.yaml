apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-lora
  namespace: lora-serving
  labels:
    app: vllm-lora
    app.kubernetes.io/name: vllm-lora
    app.kubernetes.io/component: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-lora
  template:
    metadata:
      labels:
        app: vllm-lora
        app.kubernetes.io/name: vllm-lora
        app.kubernetes.io/component: inference
    spec:
      serviceAccountName: vllm-lora
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: VLLM_MODEL
          value: "meta-llama/Llama-2-7b-hf"
        - name: VLLM_ENABLE_LORA
          value: "true"
        - name: VLLM_MAX_LORAS
          value: "8"
        - name: VLLM_MAX_LORA_RANK
          value: "64"
        - name: VLLM_LORA_EXTRA_VOCAB_SIZE
          value: "256"
        - name: VLLM_LORA_TUNED_CONFIG_DIR
          value: "/adapter-configs"
        # KV Cache Offloading
        - name: VLLM_KV_CONNECTOR
          value: "offloading"
        # Speculative Decoding
        - name: VLLM_SPECULATIVE_CONFIG_METHOD
          value: "mtp"
        # Sleep Mode
        - name: VLLM_ENABLE_SLEEP_MODE
          value: "true"
        - name: VLLM_SERVER_DEV_MODE
          value: "1"
        # LoRA Registry
        - name: LORA_REGISTRY_ENABLED
          value: "true"
        - name: LORA_REGISTRY_PATH
          value: "/data/lora_registry.db"
        resources:
          requests:
            nvidia.com/gpu: 1
            memory: "16Gi"
            cpu: "4"
          limits:
            nvidia.com/gpu: 1
            memory: "32Gi"
            cpu: "8"
        volumeMounts:
        - name: adapter-storage
          mountPath: /adapter-configs
        - name: registry-storage
          mountPath: /data
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: adapter-storage
        persistentVolumeClaim:
          claimName: adapter-pvc
      - name: registry-storage
        persistentVolumeClaim:
          claimName: registry-pvc
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      nodeSelector:
        accelerator: nvidia-tesla-a10g
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
