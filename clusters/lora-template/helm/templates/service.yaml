apiVersion: v1
kind: Service
metadata:
  name: {{ include "lora-serving.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lora-serving.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "lora-serving.selectorLabels" . | nindent 4 }}
