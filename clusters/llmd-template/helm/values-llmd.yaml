# llm-d Helm Values
# KServe + Gateway API + LeaderWorkerSet + vLLM

llmd:
  enabled: true
  backend: vllm  # vllm, sglang, dynamo, tensorrt_llm

model:
  id: meta-llama/Llama-2-7b-hf
  name: llmd-model
  storageUri: pvc://model-pvc

resources:
  gpu:
    type: H100
    count: 2
    memory: 80  # GB per GPU
  cpu:
    count: 48
  memory: 256  # GB
  disk: 200  # GB

vllm:
  tensorParallelSize: 1
  dataParallelSize: 2
  gpuMemoryUtilization: 0.90
  maxModelLen: 8192
  enablePrefixCaching: true
  enableChunkedPrefill: true
  enableKVOffloading: true
  attentionBackend: FLASHINFER
  useDeepGEMM: true

nixl:
  enabled: true
  rdma: true
  zeroCopy: true

gateway:
  enabled: true
  className: llmd-gateway-class
  port: 80
  hostname: "*.llmd.local"

leaderWorkerSet:
  replicas: 2
  leaderSelector:
    app: llmd-model
    role: leader
  workerSelector:
    app: llmd-model
    role: worker

topology:
  preferNvlink: true
  minGpuMemoryGb: 80
  minNvlinkBandwidthGbps: 450
  preferSameSwitch: true
  numaAware: true
