name: Terradev CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # === Rust Testing ===
  rust-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust ${{ matrix.rust }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Run cargo test
      run: |
        if [ -f "rust/Cargo.toml" ]; then
          cd rust
          cargo test --workspace --verbose
        else
          echo "No rust/ workspace found, skipping Rust tests"
        fi

    - name: Run cargo clippy
      run: |
        if [ -f "rust/Cargo.toml" ]; then
          cd rust
          cargo clippy --workspace -- -D warnings
        fi

    - name: Run cargo fmt
      run: |
        if [ -f "rust/Cargo.toml" ]; then
          cd rust
          cargo fmt --all -- --check
        fi

  # === Code Quality (Linting) ===
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        pip install mypy ruff

    # Flake8 disabled - 1000+ errors need cleanup
    # - name: Flake8 check
    #   run: flake8 terradev_cli/ tests/ --max-line-length=120 --ignore=E203,W503

    - name: MyPy check
      run: mypy terradev_cli/ --ignore-missing-imports --no-strict-optional || true

    - name: Ruff check
      run: ruff check terradev_cli/ tests/ --ignore F401,F821,F841,E402,E501,F541,E712

  # === Unit Tests (Linux) ===
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    env:
      TERRADEV_SKIP_ONBOARDING: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TERRADEV_GITHUB_TOKEN: ${{ secrets.TERRADEV_GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Clear pip cache
      run: pip cache purge

    - name: Install package + test deps
      run: |
        pip install -e ".[dev]" 2>/dev/null || pip install -e .
        pip install pytest pytest-asyncio pytest-cov pytest-xdist

    - name: CLI smoke test
      run: |
        terradev --version
        terradev --help

    - name: Check for legacy duplicate files
      run: |
        if find terradev_cli -type f \( -name "*_old.py" -o -name "*_backup.py" -o -name "*_fixed.py" -o -name "*_simple.py" -o -name "*_final.py" -o -name "*_clean.py" -o -name "*_tiered.py" \) | grep -q .; then
          echo "ERROR: Legacy duplicate files found. These should be deleted and not committed."
          find terradev_cli -type f \( -name "*_old.py" -o -name "*_backup.py" -o -name "*_fixed.py" -o -name "*_simple.py" -o -name "*_final.py" -o -name "*_clean.py" -o -name "*_tiered.py" \)
          exit 1
        fi

    - name: Run unit tests with coverage
      run: |
        pytest tests/ -v --tb=short --cov=terradev_cli --cov-report=xml --cov-report=html --cov-fail-under=20 --ignore=tests/test_mcp_handlers.py -n auto

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests-linux-${{ matrix.python-version }}
        name: codecov-linux-${{ matrix.python-version }}

  # === Unit Tests (Windows) ===
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      TERRADEV_SKIP_ONBOARDING: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package + test deps
      shell: pwsh
      run: |
        pip install -e ".[dev]" 2>$null; if ($LASTEXITCODE -ne 0) { pip install -e . }
        pip install pytest pytest-asyncio pytest-cov

    - name: CLI smoke test
      shell: pwsh
      run: |
        terradev --version
        terradev --help

    - name: Run unit tests (Windows)
      shell: pwsh
      run: pytest tests/ -v --tb=short --ignore=tests/test_mcp_handlers.py --ignore=tests/test_integration.py

  # === Unit Tests (macOS) ===
  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      TERRADEV_SKIP_ONBOARDING: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package + test deps
      run: |
        pip install -e ".[dev]" 2>/dev/null || pip install -e .
        pip install pytest pytest-asyncio pytest-cov

    - name: CLI smoke test
      run: |
        terradev --version
        terradev --help

    - name: Run unit tests (macOS)
      run: pytest tests/ -v --tb=short --ignore=tests/test_mcp_handlers.py --ignore=tests/test_integration.py

  # === Integration Tests (Mock) ===
  integration-mock:
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      MOCK: "true"
      TERRADEV_SKIP_ONBOARDING: "1"

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package + test deps
      run: |
        pip install -e ".[dev]" 2>/dev/null || pip install -e .
        pip install pytest pytest-asyncio

    - name: Run integration tests (mock)
      run: python tests/test_integration.py --mock --suite providers

  # === Integration Tests (Real Credentials - Optional) ===
  integration-live:
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'workflow_dispatch'
    env:
      TERRADEV_SKIP_ONBOARDING: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_TEST_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_TEST_SECRET }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_TEST_KEY }}
      VAST_API_KEY: ${{ secrets.VAST_TEST_KEY }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package + test deps
      run: |
        pip install -e ".[dev]" 2>/dev/null || pip install -e .
        pip install pytest pytest-asyncio

    - name: Run integration tests (live)
      run: python tests/test_integration.py --suite providers
      continue-on-error: true

  # === Build Package ===
  build:
    runs-on: ubuntu-latest
    needs: [rust-test, test-linux, lint]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build wheel + sdist
      run: |
        pip install build
        python -m build

    - name: Verify built package installs
      run: |
        pip install dist/*.whl
        terradev --version

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  # === Security Scanning ===
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package for scan
      run: pip install -e ".[dev]" 2>/dev/null || pip install -e .

    - name: Install + scan
      run: |
        pip install bandit safety
        bandit -r terradev_cli/ -f json -o bandit-report.json -lll || true
        bandit -r terradev_cli/ -lll --exit-zero
        safety check --json --output safety-report.json || true

    - uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # === Docker Build Test ===
  docker-build:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        if [ -f "Dockerfile" ]; then
          docker build -t terradev-test .
        elif [ -f "Dockerfile.test" ]; then
          docker build -f Dockerfile.test -t terradev-test .
        else
          echo "No Dockerfile found, skipping Docker build"
        fi

  # === Documentation Build ===
  docs-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install documentation tools
      run: |
        pip install mkdocs mkdocs-material pymdown-extensions

    - name: Build documentation
      run: |
        if [ -f "mkdocs.yml" ]; then
          mkdocs build
        else
          echo "No mkdocs.yml found, skipping docs build"
        fi

  # === Performance Benchmarking ===
  benchmark:
    runs-on: ubuntu-latest
    needs: [test-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package + test deps
      run: |
        pip install -e ".[dev]" 2>/dev/null || pip install -e .
        pip install pytest pytest-asyncio

    - name: Run performance benchmarks
      run: python tests/test_integration.py --performance --suite performance
      continue-on-error: true

  # === Publish to PyPI ===
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, test-windows, test-macos, build, security]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build
      run: |
        pip install build
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
