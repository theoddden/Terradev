name: Terradev CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust ${{ matrix.rust }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Run cargo test
      run: |
        if [ -f "float-protocols/Cargo.toml" ]; then
          cd float-protocols
          cargo test --verbose
        elif [ -f "dxfeed-rust-api/Cargo.toml" ]; then
          cd dxfeed-rust-api
          cargo test --verbose
        else
          echo "No Rust Cargo.toml found, skipping Rust tests"
        fi

    - name: Run cargo clippy
      run: |
        if [ -f "float-protocols/Cargo.toml" ]; then
          cd float-protocols
          cargo clippy -- -D warnings
        elif [ -f "dxfeed-rust-api/Cargo.toml" ]; then
          cd dxfeed-rust-api
          cargo clippy -- -D warnings
        fi

    - name: Run cargo fmt
      run: |
        if [ -f "float-protocols/Cargo.toml" ]; then
          cd float-protocols
          cargo fmt --all -- --check
        elif [ -f "dxfeed-rust-api/Cargo.toml" ]; then
          cd dxfeed-rust-api
          cargo fmt --all -- --check
        fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    env:
      TERRADEV_SKIP_ONBOARDING: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TERRADEV_GITHUB_TOKEN: ${{ secrets.TERRADEV_GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package + test deps
      run: |
        pip install -e ".[dev]" 2>/dev/null || pip install -e .
        pip install pytest pytest-asyncio pytest-cov safety

    - name: CLI smoke test
      run: |
        terradev --version
        terradev --help

    - name: Check for legacy duplicate files
      run: |
        # Fail if any *_old.py, *_backup.py, *_fixed.py, *_simple.py, *_final.py, *_clean.py, *_tiered.py files exist
        if find terradev_cli -type f -name "*_old.py" -o -name "*_backup.py" -o -name "*_fixed.py" -o -name "*_simple.py" -o -name "*_final.py" -o -name "*_clean.py" -o -name "*_tiered.py" | grep -q .; then
          echo "ERROR: Legacy duplicate files found. These should be deleted and not committed."
          find terradev_cli -type f \( -name "*_old.py" -o -name "*_backup.py" -o -name "*_fixed.py" -o -name "*_simple.py" -o -name "*_final.py" -o -name "*_clean.py" -o -name "*_tiered.py" \)
          exit 1
        fi

    - name: Run test suite with coverage
      run: pytest tests/ -v --tb=short --cov=terradev_cli --cov-report=xml --cov-report=html

    - name: Test MCP server loading
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TERRADEV_GITHUB_TOKEN: ${{ secrets.TERRADEV_GITHUB_TOKEN }}
      run: |
        python -c "from terradev_cli.mcp import server; print('MCP server loaded successfully')"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build:
    runs-on: ubuntu-latest
    needs: [rust-test, test]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build wheel + sdist
      run: |
        pip install build
        python -m build

    - name: Verify built package installs
      run: |
        pip install dist/*.whl
        terradev --version

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install + scan
      run: |
        pip install bandit safety
        bandit -r terradev_cli/ -f json -o bandit-report.json -ll || true
        safety check --json --output safety-report.json || true

    - uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build
      run: |
        pip install build
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
