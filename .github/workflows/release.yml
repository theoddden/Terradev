name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  releases: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create GitHub Release
      run: |
        gh release create ${{ github.ref_name }} --generate-notes
