name: Release to PyPI

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Clean dist and build directories
      run: rm -rf dist build

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check distribution metadata
      run: twine check dist/*

    - name: Inspect wheel contents
      run: |
        python - <<'PY'
        import zipfile, glob
        whl = glob.glob('dist/*.whl')[0]
        with zipfile.ZipFile(whl) as z:
            print(f"Wheel: {whl}")
            print(f"Total files: {len(z.namelist())}")
            for name in z.namelist()[:30]:
                print(name)
        PY

    - name: Local smoke test wheel before upload
      run: |
        python -m venv smoke_env
        source smoke_env/bin/activate
        pip install dist/*.whl
        TERRADEV_SKIP_ONBOARDING=1 terradev mcp list-tools >/dev/null
        deactivate
        rm -rf smoke_env

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload --skip-existing dist/*

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view ${{ github.ref_name }} >/dev/null 2>&1 || gh release create ${{ github.ref_name }} --generate-notes

    - name: Smoke test published package before registry publish
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        python -m venv smoke_env
        source smoke_env/bin/activate
        for i in 1 2 3 4 5; do
          pip install "terradev-cli==$VERSION" && break
          echo "PyPI not ready, retrying in 15s..."
          sleep 15
        done
        TERRADEV_SKIP_ONBOARDING=1 terradev mcp list-tools >/dev/null
        deactivate

    - name: Download mcp-publisher
      run: |
        curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
        sudo mv mcp-publisher /usr/local/bin/

    - name: Authenticate with MCP Registry via OIDC
      run: mcp-publisher login github-oidc

    - name: Sync server.json version with package version
      run: |
        python - <<'PY'
        import json, tomllib
        with open("pyproject.toml", "rb") as f:
            version = tomllib.load(f)["project"]["version"]
        with open("server.json") as f:
            server = json.load(f)
        server["version"] = version
        server["packages"][0]["version"] = version
        with open("server.json", "w") as f:
            json.dump(server, f, indent=2)
            f.write("\n")
        PY

    - name: Publish server.json to MCP Registry
      run: mcp-publisher publish
