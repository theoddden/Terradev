name: Release to PyPI

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload --skip-existing dist/*

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view ${{ github.ref_name }} >/dev/null 2>&1 || gh release create ${{ github.ref_name }} --generate-notes

    - name: Smoke test published package before registry publish
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        python -m venv smoke_env
        source smoke_env/bin/activate
        for i in 1 2 3 4 5; do
          pip install "terradev-cli==$VERSION" && break
          echo "PyPI not ready, retrying in 15s..."
          sleep 15
        done
        TERRADEV_SKIP_ONBOARDING=1 terradev mcp list-tools >/dev/null
        deactivate

    - name: Download mcp-publisher
      run: |
        curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
        sudo mv mcp-publisher /usr/local/bin/

    - name: Authenticate with MCP Registry via OIDC
      run: mcp-publisher login github-oidc

    - name: Publish server.json to MCP Registry
      run: mcp-publisher publish
