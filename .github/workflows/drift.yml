name: Provider API Drift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Terradev CLI
        run: pip install .

      - name: Run canary drift checks
        env:
          TERRADEV_SKIP_ONBOARDING: "1"
          TERRADEV_BASENTEN_KEY: ${{ secrets.TERRADEV_BASENTEN_KEY }}
          TERRADEV_BASENTEN_API_KEY: ${{ secrets.TERRADEV_BASENTEN_API_KEY }}
          TERRADEV_BASETEN_KEY: ${{ secrets.TERRADEV_BASETEN_KEY }}
          TERRADEV_BASETEN_API_KEY: ${{ secrets.TERRADEV_BASETEN_API_KEY }}
          TERRADEV_DIGITALOCEAN_KEY: ${{ secrets.TERRADEV_DIGITALOCEAN_KEY }}
          TERRADEV_DIGITALOCEAN_API_KEY: ${{ secrets.TERRADEV_DIGITALOCEAN_API_KEY }}
          TERRADEV_E2ENETWORKS_KEY: ${{ secrets.TERRADEV_E2ENETWORKS_KEY }}
          TERRADEV_E2ENETWORKS_API_KEY: ${{ secrets.TERRADEV_E2ENETWORKS_API_KEY }}
          TERRADEV_E2ENETWORKS_PROJECT_ID: ${{ secrets.TERRADEV_E2ENETWORKS_PROJECT_ID }}
          TERRADEV_E2ENETWORKS_LOCATION: ${{ secrets.TERRADEV_E2ENETWORKS_LOCATION }}
          TERRADEV_HYPERSTACK_KEY: ${{ secrets.TERRADEV_HYPERSTACK_KEY }}
          TERRADEV_HYPERSTACK_API_KEY: ${{ secrets.TERRADEV_HYPERSTACK_API_KEY }}
          TERRADEV_LATITUDE_KEY: ${{ secrets.TERRADEV_LATITUDE_KEY }}
          TERRADEV_LATITUDE_API_KEY: ${{ secrets.TERRADEV_LATITUDE_API_KEY }}
          TERRADEV_RUNPOD_KEY: ${{ secrets.TERRADEV_RUNPOD_KEY }}
          TERRADEV_RUNPOD_API_KEY: ${{ secrets.TERRADEV_RUNPOD_API_KEY }}
          TERRADEV_SILICONFLOW_KEY: ${{ secrets.TERRADEV_SILICONFLOW_KEY }}
          TERRADEV_SILICONFLOW_API_KEY: ${{ secrets.TERRADEV_SILICONFLOW_API_KEY }}
          TERRADEV_VASTAI_KEY: ${{ secrets.TERRADEV_VASTAI_KEY }}
          TERRADEV_VASTAI_API_KEY: ${{ secrets.TERRADEV_VASTAI_API_KEY }}
          TERRADEV_YOTTALABS_KEY: ${{ secrets.TERRADEV_YOTTALABS_KEY }}
          TERRADEV_YOTTALABS_API_KEY: ${{ secrets.TERRADEV_YOTTALABS_API_KEY }}
        run: terradev canary drift --all --format json --timeout 60 > drift-report.json

      - name: Print drift report
        if: always()
        run: python3 -m json.tool drift-report.json || cat drift-report.json

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.json
