name: Provider API Drift Monitor

on:
  schedule:
    - cron: '0 13 * * *'  # 9am EDT / 6am PDT — morning run
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift_check:
    name: Check provider API contracts for drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "." requests pyyaml

      - name: Run drift monitor
        env:
          TERRADEV_RUNPOD_KEY: ${{ secrets.TERRADEV_RUNPOD_KEY }}
          TERRADEV_LAMBDA_KEY: ${{ secrets.TERRADEV_LAMBDA_KEY }}
          TERRADEV_VAST_KEY: ${{ secrets.TERRADEV_VAST_KEY }}
          TERRADEV_COREWEAVE_KEY: ${{ secrets.TERRADEV_COREWEAVE_KEY }}
          TERRADEV_HYPERSTACK_KEY: ${{ secrets.TERRADEV_HYPERSTACK_KEY }}
          TERRADEV_SKIP_ONBOARDING: '1'
        run: |
          terradev canary drift --all --format json > drift_report.json

      - name: Check for drift
        run: |
          python3 -c "
          import json, sys
          report = json.load(open('drift_report.json'))
          if report['drifted'] > 0:
              print(f'DRIFT DETECTED: {report[\"drift_providers\"]}')
              sys.exit(1)
          print('All providers healthy')
          "

      - name: Open GitHub issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = JSON.parse(fs.readFileSync('drift_report.json'))
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Provider drift detected: ${report.drift_providers.join(', ')}`,
              body: `\`\`\`json\n${JSON.stringify(report, null, 2)}\n\`\`\``,
              labels: ['provider-drift', 'automated']
            })
