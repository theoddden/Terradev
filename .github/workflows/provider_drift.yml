name: Provider API Drift Monitor

on:
  schedule:
    - cron: '0 13 * * *'  # 9am EDT / 6am PDT — morning run
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift_check:
    name: Check provider API contracts for drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      TERRADEV_SKIP_ONBOARDING: '1'
      TERRADEV_AWS_ACCESS_KEY_ID: ${{ secrets.TERRADEV_AWS_ACCESS_KEY_ID }}
      TERRADEV_AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRADEV_AWS_SECRET_ACCESS_KEY }}
      TERRADEV_AWS_SESSION_TOKEN: ${{ secrets.TERRADEV_AWS_SESSION_TOKEN }}
      TERRADEV_AWS_REGION: ${{ secrets.TERRADEV_AWS_REGION }}
      TERRADEV_GCP_CREDENTIALS: ${{ secrets.TERRADEV_GCP_CREDENTIALS }}
      TERRADEV_AZURE_KEY: ${{ secrets.TERRADEV_AZURE_KEY }}
      TERRADEV_AZURE_SUBSCRIPTION_ID: ${{ secrets.TERRADEV_AZURE_SUBSCRIPTION_ID }}
      TERRADEV_AZURE_TENANT_ID: ${{ secrets.TERRADEV_AZURE_TENANT_ID }}
      TERRADEV_AZURE_CLIENT_ID: ${{ secrets.TERRADEV_AZURE_CLIENT_ID }}
      TERRADEV_AZURE_CLIENT_SECRET: ${{ secrets.TERRADEV_AZURE_CLIENT_SECRET }}
      TERRADEV_AZURE_LOCATION: ${{ secrets.TERRADEV_AZURE_LOCATION }}
      TERRADEV_INFERX_API_KEY: ${{ secrets.TERRADEV_INFERX_API_KEY }}
      TERRADEV_BASENTEN_KEY: ${{ secrets.TERRADEV_BASENTEN_KEY }}
      TERRADEV_BASENTEN_API_KEY: ${{ secrets.TERRADEV_BASENTEN_API_KEY }}
      TERRADEV_BASETEN_KEY: ${{ secrets.TERRADEV_BASETEN_KEY }}
      TERRADEV_BASETEN_API_KEY: ${{ secrets.TERRADEV_BASETEN_API_KEY }}
      TERRADEV_DIGITALOCEAN_KEY: ${{ secrets.TERRADEV_DIGITALOCEAN_KEY }}
      TERRADEV_DIGITALOCEAN_API_KEY: ${{ secrets.TERRADEV_DIGITALOCEAN_API_KEY }}
      TERRADEV_E2ENETWORKS_KEY: ${{ secrets.TERRADEV_E2ENETWORKS_KEY }}
      TERRADEV_E2ENETWORKS_API_KEY: ${{ secrets.TERRADEV_E2ENETWORKS_API_KEY }}
      TERRADEV_E2ENETWORKS_BEARER_TOKEN: ${{ secrets.TERRADEV_E2ENETWORKS_BEARER_TOKEN }}
      TERRADEV_E2ENETWORKS_AUTH_TOKEN: ${{ secrets.TERRADEV_E2ENETWORKS_AUTH_TOKEN }}
      TERRADEV_E2ENETWORKS_TOKEN: ${{ secrets.TERRADEV_E2ENETWORKS_TOKEN }}
      TERRADEV_E2ENETWORKS_PROJECT_ID: ${{ secrets.TERRADEV_E2ENETWORKS_PROJECT_ID }}
      TERRADEV_E2ENETWORKS_LOCATION: ${{ secrets.TERRADEV_E2ENETWORKS_LOCATION }}
      TERRADEV_GCORE_KEY: ${{ secrets.TERRADEV_GCORE_KEY }}
      TERRADEV_HYPERSTACK_KEY: ${{ secrets.TERRADEV_HYPERSTACK_KEY }}
      TERRADEV_HYPERSTACK_API_KEY: ${{ secrets.TERRADEV_HYPERSTACK_API_KEY }}
      TERRADEV_LATITUDE_KEY: ${{ secrets.TERRADEV_LATITUDE_KEY }}
      TERRADEV_LATITUDE_API_KEY: ${{ secrets.TERRADEV_LATITUDE_API_KEY }}
      TERRADEV_RUNPOD_KEY: ${{ secrets.TERRADEV_RUNPOD_KEY }}
      TERRADEV_RUNPOD_API_KEY: ${{ secrets.TERRADEV_RUNPOD_API_KEY }}
      TERRADEV_LAMBDA_KEY: ${{ secrets.TERRADEV_LAMBDA_KEY }}
      TERRADEV_LAMBDA_API_KEY: ${{ secrets.TERRADEV_LAMBDA_API_KEY }}
      TERRADEV_VAST_KEY: ${{ secrets.TERRADEV_VAST_KEY }}
      TERRADEV_VASTAI_KEY: ${{ secrets.TERRADEV_VASTAI_KEY }}
      TERRADEV_VASTAI_API_KEY: ${{ secrets.TERRADEV_VASTAI_API_KEY }}
      TERRADEV_COREWEAVE_KEY: ${{ secrets.TERRADEV_COREWEAVE_KEY }}
      TERRADEV_COREWEAVE_API_KEY: ${{ secrets.TERRADEV_COREWEAVE_API_KEY }}
      TERRADEV_SILICONFLOW_KEY: ${{ secrets.TERRADEV_SILICONFLOW_KEY }}
      TERRADEV_SILICONFLOW_API_KEY: ${{ secrets.TERRADEV_SILICONFLOW_API_KEY }}
      TERRADEV_YOTTALABS_KEY: ${{ secrets.TERRADEV_YOTTALABS_KEY }}
      TERRADEV_YOTTALABS_API_KEY: ${{ secrets.TERRADEV_YOTTALABS_API_KEY }}
      TERRADEV_MODAL_KEY: ${{ secrets.TERRADEV_MODAL_KEY }}
      TERRADEV_MODAL_TOKEN_ID: ${{ secrets.TERRADEV_MODAL_TOKEN_ID }}
      TERRADEV_MODAL_TOKEN_SECRET: ${{ secrets.TERRADEV_MODAL_TOKEN_SECRET }}
      TERRADEV_PACKET_KEY: ${{ secrets.TERRADEV_PACKET_KEY }}
      TERRADEV_PACKET_API_KEY: ${{ secrets.TERRADEV_PACKET_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y terradev terradev-cli 2>/dev/null || true
          pip install -e "." requests pyyaml

      - name: Check credential env presence
        run: |
          for v in TERRADEV_MODAL_KEY TERRADEV_MODAL_TOKEN_ID TERRADEV_MODAL_TOKEN_SECRET TERRADEV_PACKET_KEY TERRADEV_PACKET_API_KEY; do
            if [ -n "${!v}" ]; then
              echo "$v is set"
            else
              echo "$v is NOT set"
            fi
          done

      - name: Debug canary module and loader
        run: |
          python3 -c "
          from pathlib import Path
          import terradev_cli.commands.canary as c
          from terradev_cli.commands.canary import _load_drift_credentials, _default_contracts_dir
          import yaml
          print('canary module:', c.__file__)
          contracts = sorted(Path(_default_contracts_dir()).glob('*.yaml'))
          providers = []
          for p in contracts:
              with open(p) as f:
                  contract = yaml.safe_load(f) or {}
              providers.append(contract.get('provider') or p.stem)
          creds = _load_drift_credentials(providers)
          print('credential keys:', list(creds.keys()))
          print('missing:', sorted(set(providers) - set(creds)))
          for p in ('modal', 'packet'):
              print(p, 'in creds:', p in creds, 'type:', type(creds.get(p)).__name__)
          "

      - name: Run drift monitor
        run: |
          python -m terradev_cli.cli canary drift --all --format json > drift_report.json

      - name: Check for drift
        run: |
          python3 -c "
          import json, sys
          report = json.load(open('drift_report.json'))
          if report['drifted'] > 0:
              print(f'DRIFT DETECTED: {report[\"drift_providers\"]}')
              sys.exit(1)
          print('All providers healthy')
          "

      - name: Open GitHub issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = JSON.parse(fs.readFileSync('drift_report.json'))
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Provider drift detected: ${report.drift_providers.join(', ')}`,
              body: `\`\`\`json\n${JSON.stringify(report, null, 2)}\n\`\`\``,
              labels: ['provider-drift', 'automated']
            })
