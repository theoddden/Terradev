name: Canary Provisioning

on:
  # Manual trigger from the Actions tab with provider/GPU inputs
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to canary (runpod, vastai, lambda_labs, or comma list)'
        required: true
        default: 'runpod'
      gpu_type:
        description: 'GPU type to test'
        required: true
        default: 'RTX4090'
      max_price:
        description: 'Max $/hr for the canary instance'
        required: true
        default: '0.50'
      timeout:
        description: 'Polling timeout in seconds'
        required: true
        default: '300'

  # Run on every release as a final gate before users see it
  release:
    types: [published]

  # Nightly low-traffic canary against real APIs
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: canary-provisioning-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.provider || 'all' }}-${{ github.event.inputs.gpu_type || 'scheduled' }}
  cancel-in-progress: false

jobs:
  canary:
    name: Live canary provision (${{ github.event.inputs.provider || 'runpod' }} / ${{ github.event.inputs.gpu_type || 'RTX4090' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TERRADEV_CANARY_TEST: '1'
      TERRADEV_CANARY_GPU: ${{ github.event.inputs.gpu_type || 'RTX4090' }}
      TERRADEV_CANARY_MAX_PRICE: ${{ github.event.inputs.max_price || '0.50' }}
      TERRADEV_CANARY_TIMEOUT: ${{ github.event.inputs.timeout || '300' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-asyncio

      - name: Write provider credentials
        # Credentials are stored one per line in GitHub Secrets as JSON objects.
        # Example secret name: CANARY_RUNPOD_CREDS -> {"api_key":"rpa_xxx"}
        # Set secret for each provider you want to canary.
        env:
          CANARY_RUNPOD_CREDS: ${{ secrets.CANARY_RUNPOD_CREDS }}
          CANARY_VASTAI_CREDS: ${{ secrets.CANARY_VASTAI_CREDS }}
          CANARY_LAMBDA_LABS_CREDS: ${{ secrets.CANARY_LAMBDA_LABS_CREDS }}
        run: |
          mkdir -p "$HOME/.terradev"
          # Build credentials.json from available secrets
          python - <<'PY'
          import json, os

          mapping = {
              "runpod": "CANARY_RUNPOD_CREDS",
              "vastai": "CANARY_VASTAI_CREDS",
              "lambda_labs": "CANARY_LAMBDA_LABS_CREDS",
          }

          provider_arg = os.environ.get("TERRADEV_CANARY_PROVIDERS", "runpod")
          requested = [p.strip() for p in provider_arg.split(",")]

          creds = {}
          for prov in requested:
              secret_name = mapping.get(prov)
              if not secret_name:
                  continue
              value = os.environ.get(secret_name)
              if value:
                  try:
                      creds[prov] = json.loads(value)
                  except json.JSONDecodeError:
                      print(f"Warning: secret for {prov} is not valid JSON")

          # Legacy flat format fallback for tests
          if "runpod" in creds:
              creds.setdefault("runpod_api_key", creds["runpod"].get("api_key", ""))

          with open(os.path.expanduser("~/.terradev/credentials.json"), "w") as f:
              json.dump(creds, f, indent=2)
          print(f"Wrote credentials for: {list(creds.keys())}")
          PY

      - name: Run canary tests for requested provider(s)
        run: |
          provider_arg="${{ github.event.inputs.provider || 'runpod' }}"
          for provider in $(echo "$provider_arg" | tr ',' ' '); do
            echo "=== Canary: $provider ==="
            pytest tests/test_canary_provisioning.py -v -k "$provider" --tb=short
          done

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report-${{ github.run_id }}
          path: canary-report.json
          if-no-files-found: ignore
