[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "terradev-cli"
version = "5.2.0"
description = "An imperative command-line-interface for AI workload orchestration."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Terradev Team", email = "team@terradev.com"}
]
maintainers = [
    {name = "Terradev Team", email = "team@terradev.com"}
]
keywords = [
    "cloud",
    "provisioning", 
    "gpu",
    "multi-cloud",
    "arbitrage",
    "aws",
    "gcp",
    "azure",
    "runpod",
    "vastai",
    "machine-learning",
    "cost-optimization",
    "parallel",
    "gitops",
    "argocd",
    "flux",
    "kubernetes",
    "infrastructure-as-code",
    "langchain",
    "langgraph",
    "sglang",
    "wandb",
    "mlflow",
    "analytics",
    "setup",
    "conversion",
    "telemetry",
    "real-time",
    "monitoring",
    "dashboard",
    "huggingface",
    "huggingface-spaces",
    "gradio",
    "streamlit",
    "llm",
    "transformers",
    "pytorch",
    "sentence-transformers",
    "smart-templates",
    "hardware-optimization",
    "model-deployment",
    "inference",
    "training",
    "byoapi",
    "terraform",
    "kubernetes",
    "helm",
    "karpenter",
    "opa",
    "prometheus",
    "grafana",
    "ray",
    "vllm",
    "ollama",
    "dvc",
    "data-version-control",
    "numa",
    "disaggregated-inference",
    "moe",
    "mixture-of-experts",
    "qwen",
    "distserve",
    "xcd",
    "mi300x",
    "h200",
    "prefill-decode",
    "cuda-graph",
    "cuda-graphs",
    "numa-topology",
    "gpu-optimization",
    "passive-optimization",
    "warm-pool",
    "endpoint-scoring"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Natural Language :: English"
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "aiohttp>=3.10.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "requests>=2.31.0",
    "plotly>=5.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34.0"]
gcp = ["google-cloud-compute>=1.8.0"]
azure = ["azure-mgmt-compute>=29.0.0", "azure-identity>=1.12.0"]
lmcache = ["lmcache>=0.1", "redis>=5.0.0"]
ml = [
    "torch>=2.0.0",
    "transformers>=4.0.0",
    "sentence-transformers>=2.0.0",
    "gradio>=4.0.0",
    "streamlit>=1.28.0",
]
billing = ["stripe>=10.0.0"]
all = [
    "boto3>=1.34.0",
    "google-cloud-compute>=1.8.0",
    "azure-mgmt-compute>=29.0.0",
    "azure-identity>=1.12.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "sglang>=0.3.0",
    "wandb>=0.16.0",
    "mlflow>=2.8.0",
    "huggingface-hub>=0.19.0",
    "prometheus-client>=0.17.0",
    "grafana-api>=1.0.3",
    "lmcache>=0.1",
    "redis>=5.0.0",
]
hf = [
    "aiohttp>=3.10.0",
    "huggingface-hub>=0.24.0",
    "gradio>=4.0.0",
    "streamlit>=1.28.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]
enterprise = [
    "python3-saml>=1.13.0",
    "authlib>=1.2.0",
    "pyotp>=2.8.0",
    "qrcode[pil]>=7.4.0",
    "redis>=5.0.0",
    "PyJWT>=2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[project.urls]
Homepage = "https://github.com/theoddden/Terradev"
Documentation = "https://github.com/theoddden/Terradev/blob/main/README.md"
Repository = "https://github.com/theoddden/Terradev"
"Bug Tracker" = "https://github.com/theoddden/Terradev/issues"
Changelog = "https://github.com/theoddden/Terradev/blob/main/CHANGELOG.md"

[project.scripts]
terradev = "terradev_cli.cli:cli"

[tool.setuptools.packages.find]
include = ["terradev_cli", "terradev_cli.*"]

[tool.setuptools.package-data]
terradev_cli = [
    "templates/*.yaml",
    "templates/*.json",
    "config/*.json",
    "core/semantic_signals/*.yaml",
]

[tool.black]
target-version = ["py39", "py310", "py311", "py312"]
line-length = 120
skip-string-normalization = true
