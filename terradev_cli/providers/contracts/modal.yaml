provider: modal
base_url: https://api.modal.com/v1
auth_header: Authorization
auth_type: bearer
auth_required: true
last_verified: '2026-08-24'
notes: >
  Modal is a serverless GPU platform.  This contract documents the REST-style
  surface used by terradev_cli.providers.modal_provider.  Auth is a combined
  token id and secret formatted as `Authorization: Bearer {token_id}.{token_secret}`.
endpoints:
- name: list_gpu_types
  method: GET
  path: gpu-types
  enabled: true
  expected_status: 200
  expected_response_fields:
  - data
  - gpu
  - gpu_type
  - price
  - price_per_hour
  - available
  - regions
  optional_response_fields:
  - vcpus
  - ram_gb
  - gpu_memory_gb
- name: list_apps
  method: GET
  path: apps
  enabled: false
  expected_status: 200
  expected_response_fields:
  - data
  - id
  - name
  - status
  - gpu
  - region
  optional_response_fields:
  - endpoint
  - app_id
  - created_at
- name: create_app
  method: POST
  path: apps
  enabled: false
  expected_status: 201
  expected_response_fields:
  - id
  - name
  - status
  - gpu
  - region
  optional_response_fields:
  - endpoint
  - app_id
  - image
- name: get_app
  method: GET
  path: apps/{id}
  enabled: false
  expected_status: 200
  expected_response_fields:
  - id
  - name
  - status
  - gpu
  - region
  optional_response_fields:
  - endpoint
  - app_id
- name: stop_app
  method: POST
  path: apps/{id}/stop
  enabled: false
  expected_status: 200
  expected_response_fields:
  - id
  - status
  optional_response_fields: []
- name: start_app
  method: POST
  path: apps/{id}/start
  enabled: false
  expected_status: 200
  expected_response_fields:
  - id
  - status
  optional_response_fields: []
- name: delete_app
  method: DELETE
  path: apps/{id}
  enabled: false
  expected_status: 204
  expected_response_fields:
  - id
  optional_response_fields: []
