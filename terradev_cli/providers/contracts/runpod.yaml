provider: runpod
base_url: https://api.runpod.io/graphql
auth_in: query
auth_query_param: api_key
last_verified: 2026-08-23
endpoints:
  - name: list_gpus
    method: POST
    required_fields: [query]
    expected_response_fields: [data, gpuTypes]
    optional_response_fields: [errors]
    smoke_test_query: "query { gpuTypes { id displayName memoryInGb } }"

  - name: list_pods
    method: POST
    required_fields: [query]
    expected_response_fields: [data, myself]
    optional_response_fields: [errors]
    smoke_test_query: "query { myself { pods { id name } } }"

  - name: create_pod
    method: POST
    enabled: false
    required_fields: [query, variables]
    expected_response_fields: [data, podFindAndDeployOnDemand]
    optional_response_fields: [errors]
    smoke_test_query: |
      mutation {
        podFindAndDeployOnDemand(input: {
          cloudType: COMMUNITY,
          gpuCount: 1,
          volumeInGb: 0,
          containerDiskInGb: 10,
          imageName: "runpod/pytorch:2.1.0-py3.10-cuda11.8-devel-ubuntu22.04",
          gpuTypeId: "NVIDIA RTX A4000",
          name: "drift-canary"
        }) {
          id
        }
      }
    smoke_test_variables: {}
