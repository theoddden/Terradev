provider: huggingface
base_url: https://huggingface.co/api
auth_required: false
last_verified: '2026-08-24'
endpoints:
- name: list_models
  method: GET
  path: models?limit=1
  expected_response_fields:
  - id
  - modelId
  optional_response_fields:
  - sha
  - lastModified
  - pipeline_tag
  - downloads
  - likes
