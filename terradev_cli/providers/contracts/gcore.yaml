provider: gcore
base_url: https://api.gcore.com/cloud
auth_type: APIKey
auth_header: Authorization
auth_required: true
last_verified: '2026-08-27'
endpoints:
- name: list_projects
  method: GET
  path: v1/projects
  enabled: true
  expected_status: 200
  expected_response_fields:
  - results
  optional_response_fields:
  - count
  - next
  - previous
- name: list_regions
  method: GET
  path: v1/regions
  enabled: true
  expected_status: 200
  query_params:
  - name: limit
    default: '50'
  expected_response_fields:
  - results
  optional_response_fields:
  - count
  - next
  - previous
- name: list_flavors
  method: GET
  path: v1/flavors/{project_id}/{region_id}
  enabled: false
  expected_status: 200
  query_params:
  - name: include_prices
    default: 'true'
  expected_response_fields:
  - results
  optional_response_fields:
  - count
  - next
  - previous
- name: list_instances
  method: GET
  path: v1/instances/{project_id}/{region_id}
  enabled: false
  expected_status: 200
  expected_response_fields:
  - results
  optional_response_fields:
  - count
  - next
  - previous
- name: create_instance
  method: POST
  path: v1/instances/{project_id}/{region_id}
  enabled: false
  expected_status: 200
  expected_response_fields:
  - tasks
  optional_response_fields:
  - instance_id
- name: get_instance
  method: GET
  path: v1/instances/{project_id}/{region_id}/{instance_id}
  enabled: false
  expected_status: 200
  expected_response_fields:
  - id
  - status
  - flavor
  - addresses
  optional_response_fields:
  - instance_name
  - region
- name: delete_instance
  method: DELETE
  path: v1/instances/{project_id}/{region_id}/{instance_id}
  enabled: false
  expected_status: 204
  expected_response_fields: []
  optional_response_fields: []
