provider: packet
base_url: https://api.packet.ai/v1
auth_header: Authorization
auth_required: true
last_verified: '2026-08-24'
notes: >
  Packet.ai GPU Cloud — dynamic (spot) and dedicated GPU instances.
  Auth is a standard API key in the Authorization header:
    `Authorization: Bearer {api_key}`.
  SSH is the primary management path; preinstalled images include CUDA and vLLM.
endpoints:
- name: list_gpus
  method: GET
  path: gpus
  enabled: false
  expected_status: 200
  expected_response_fields:
  - data
  - type
  - gpu_type
  - price
  - price_per_hour
  - status
  - available
  optional_response_fields:
  - vcpus
  - ram_gb
  - vram_gb
  - memory_gb
- name: list_instances
  method: GET
  path: instances
  enabled: true
  expected_status: 200
  expected_response_fields:
  - data
  - id
  - instance_id
  - status
  - gpu_type
  - region
  optional_response_fields:
  - public_ip
  - ip
  - tier
  - ssh
- name: create_instance
  method: POST
  path: instances
  enabled: false
  expected_status: 201
  expected_response_fields:
  - id
  - instance_id
  - status
  - gpu_type
  - region
  optional_response_fields:
  - public_ip
  - ip
  - tier
  - ssh
- name: get_instance
  method: GET
  path: instances/{id}
  enabled: false
  expected_status: 200
  expected_response_fields:
  - id
  - instance_id
  - status
  - gpu_type
  - region
  optional_response_fields:
  - public_ip
  - ip
  - tier
  - ssh
- name: stop_instance
  method: POST
  path: instances/{id}/stop
  enabled: false
  expected_status: 200
  expected_response_fields:
  - id
  - status
  optional_response_fields: []
- name: start_instance
  method: POST
  path: instances/{id}/start
  enabled: false
  expected_status: 200
  expected_response_fields:
  - id
  - status
  optional_response_fields: []
- name: delete_instance
  method: DELETE
  path: instances/{id}
  enabled: false
  expected_status: 204
  expected_response_fields:
  - id
  optional_response_fields: []
