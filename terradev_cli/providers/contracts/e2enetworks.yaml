provider: e2enetworks
base_url: https://api.e2enetworks.com/myaccount/api/v1
auth_type: Bearer
auth_header: Authorization
auth_required: true
last_verified: '2026-08-24'
endpoints:
- name: list_plans
  method: GET
  path: plans/
  enabled: true
  expected_status: 200
  expected_response_fields:
  - name
  - plan_name
  - gpu_type
  - gpu
  - price
  - price_per_hour
  - region
  - available
  - vcpus
  - cpu
  - ram
  - ram_gb
  - gpu_count
  - gpu_num
  optional_response_fields:
  - data
  - results
- name: list_node_types
  method: GET
  path: node-types/
  enabled: true
  expected_status: 200
  expected_response_fields:
  - name
  - plan_name
  - gpu_type
  - gpu
  - price
  - price_per_hour
  - region
  - available
  - vcpus
  - cpu
  - ram
  - ram_gb
  - gpu_count
  - gpu_num
  optional_response_fields:
  - data
  - results
- name: list_images
  method: GET
  path: images/
  enabled: true
  expected_status: 200
  expected_response_fields:
  - id
  - name
  - slug
  - distribution
  - os
  optional_response_fields:
  - data
  - results
- name: list_nodes
  method: GET
  path: nodes/
  enabled: true
  expected_status: 200
  expected_response_fields:
  - id
  - plan
  - node_type
  - status
  - location
  - region
  - ip
  - public_ip
  - gpu_count
  optional_response_fields:
  - data
  - results
- name: create_node
  method: POST
  path: nodes/
  enabled: false
  expected_status: 201
  expected_response_fields:
  - id
  - status
  - name
  - plan
  - location
  - gpu_count
  optional_response_fields:
  - data
- name: delete_node
  method: DELETE
  path: nodes/{id}/
  enabled: false
  expected_status: 204
  expected_response_fields:
  - name
  optional_response_fields: []
