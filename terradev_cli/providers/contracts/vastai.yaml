provider: vastai
base_url: https://cloud.vast.ai/api/v0
auth_required: false
auth_type: Bearer
auth_header: Authorization
last_verified: '2026-08-24'
endpoints:
- name: list_instances
  method: GET
  path: bundles/
  expected_response_fields:
  - offers
  optional_response_fields:
  - offers.id
  - offers.gpu_name
  - offers.num_gpus
  - offers.dph_total
  expected_status: 200
- name: bundles
  method: POST
  path: bundles
  enabled: false
  expected_response_fields: []
  optional_response_fields: []
  expected_status: 201
- name: instances?owner=me
  method: GET
  path: instances?owner=me
  enabled: false
  expected_response_fields:
  - data
  optional_response_fields: []
  expected_status: 200
