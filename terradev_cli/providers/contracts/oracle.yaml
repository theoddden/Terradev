provider: oracle
base_url: https://iaas.{oci_region}.oraclecloud.com/20160918
auth_required: true
auth_in: header
auth_type: RSA
auth_header: Authorization
last_verified: '2026-08-25'
endpoints:
- name: list_shapes
  method: GET
  path: shapes
  enabled: true
  expected_status: 200
  query_params:
  - name: compartmentId
    from_credential: oci_tenancy
  - name: availabilityDomain
    default: ""
  expected_response_fields:
  - shape
  - processorDescription
  - networkingBandwidthInGbps
  optional_response_fields:
  - ocpus
  - memoryInGBs
  - localDisks
