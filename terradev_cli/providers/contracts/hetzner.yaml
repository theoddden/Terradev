provider: hetzner
base_url: https://api.hetzner.cloud/v1
auth_type: Bearer
auth_header: Authorization
auth_required: true
last_verified: '2026-08-24'
endpoints:
- name: list_servers
  method: GET
  path: servers
  expected_response_fields:
  - servers
  expected_status: 200
- name: server_types
  method: GET
  path: server_types
  enabled: false
  expected_response_fields:
  - data
  optional_response_fields: []
  expected_status: 200
- name: ssh_keys
  method: GET
  path: ssh_keys
  enabled: false
  expected_response_fields:
  - data
  optional_response_fields: []
  expected_status: 200
- name: servers
  method: POST
  path: servers
  enabled: false
  expected_response_fields: []
  optional_response_fields: []
  expected_status: 201
- name: servers?label_selector=terradev%3Dtrue
  method: GET
  path: servers?label_selector=terradev%3Dtrue
  enabled: false
  expected_response_fields:
  - data
  optional_response_fields: []
  expected_status: 200
- name: locations
  method: GET
  path: locations
  enabled: false
  expected_response_fields:
  - data
  optional_response_fields: []
  expected_status: 200
