  script:
    - pytest tests/test_mcp_handlers.py -v --tb=short

# === Unit Tests ===
test:
  stage: test
  image: python:3.11
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install -e ".[dev]" 2>/dev/null || pip install -e .
    - pip install pytest pytest-asyncio pytest-cov pytest-xdist
  script:
    - terradev --version
    - terradev --help
    - pytest tests/ -v --tb=short --cov=terradev_cli --cov-report=xml --cov-report=html --cov-fail-under=19 --ignore=tests/test_mcp_handlers.py --ignore=tests/test_integration.py -n auto
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
      - coverage.xml
    expire_in: 1 week
  only:
    - main
    - develop
    - merge_requests

# === Integration Tests (Mock) ===
integration-mock:
  stage: integration
  image: python:3.11
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install -e ".[dev]" 2>/dev/null || pip install -e .
    - pip install pytest pytest-asyncio
  script:
    - python tests/test_integration.py --mock --suite providers
  only:
    - main
    - develop
    - merge_requests

# === Integration Tests (Live - Manual) ===
integration-live:
  stage: integration
  image: python:3.11
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install -e ".[dev]" 2>/dev/null || pip install -e .
    - pip install pytest pytest-asyncio
  script:
    - python tests/test_integration.py --suite providers
  when: manual
  only:
    - main
    - develop

# === Build Package ===
build:
  stage: build
  image: python:3.11
  before_script:
    - pip install build
  script:
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - develop
    - tags

# === Security Scanning ===
security:
  stage: security
  image: python:3.11
  before_script:
    - pip install bandit safety
  script:
    - bandit -r terradev_cli/ -f json -o bandit-report.json -lll || true
    - bandit -r terradev_cli/ -lll --exit-zero
    - safety check --json --output safety-report.json || true
  artifacts:
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 week
  only:
    - main
    - develop
    - merge_requests

# === Deploy to PyPI (Manual on Tags) ===
deploy:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install build twine
  script:
    - python -m build
    - twine upload dist/*
  when: manual
  only:
    - tags
