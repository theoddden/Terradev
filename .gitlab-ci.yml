# GitLab CI/CD Pipeline for Terradev

stages:
  - lint
  - test
  - integration
  - build
  - security
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  TERRADEV_SKIP_ONBOARDING: "1"

# Cache pip dependencies
cache:
  paths:
    - .cache/pip
    - venv/

# === Linting ===
lint:
  stage: lint
  image: python:3.11
  before_script:
    - pip install mypy ruff
  script:
    # Flake8 disabled - 1000+ errors need cleanup
    # - flake8 terradev_cli/ tests/ --max-line-length=120 --ignore=E203,W503
    - mypy terradev_cli/ --ignore-missing-imports --no-strict-optional || true
    - ruff check terradev_cli/ tests/ --ignore F401,F821,F841,E402,E501,F541,E712
  only:
    - main
    - develop
    - merge_requests

# === Command Test Suite (DI migration gate) ===
test-commands:
  stage: test
  image: python:3.11
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install -e ".[dev]" 2>/dev/null || pip install -e .
    - pip install pytest pytest-asyncio
  script:
    - pytest tests/commands tests/test_cli_commands.py -v --tb=short

