[package]
name = "terradev-gpu-discovery"
version = "0.1.0"
edition = "2021"

[lib]
name = "terradev_gpu_discovery"
crate-type = ["rlib"]

[dependencies]
pyo3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
nvml-wrapper = { version = "0.10", optional = true }
pci-ids = "0.2"

[features]
default = ["nvml"]
nvml = ["nvml-wrapper"]
