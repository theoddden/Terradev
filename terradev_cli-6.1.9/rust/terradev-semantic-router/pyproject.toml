[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "terradev-semantic-router"
version = "0.1.0"
description = "Rust-backed NUMA-aware semantic router for Terradev"
requires-python = ">=3.9"

[tool.maturin]
module-name = "terradev_semantic_router"
python-packages = []
features = ["pyo3/extension-module"]
