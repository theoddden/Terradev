# Terradev Task YAML — llm-d Disaggregated Inference Deployment
# Works with: LLMInferenceService (KServe), Gateway API, LeaderWorkerSet
#
# Usage:
#   terradev provision --task clusters/llmd-template/task.yaml
#   terradev provision --task clusters/llmd-template/task.yaml --set model_id=meta-llama/Llama-2-7b-hf
#   terradev provision --task clusters/llmd-template/task.yaml --set backend=dynamo

name: llmd-disagg-inference
model: ${MODEL_ID:-meta-llama/Llama-2-7b-hf}

resources:
  accelerators: ${GPU_TYPE:-H100}:${GPU_COUNT:-2}
  cloud: any
  instance_type: any
  use_spot: false
  cpu: ${CPU_COUNT:-48}
  memory: ${MEMORY_GB:-256}+
  disk_size: ${DISK_SIZE_GB:-200}

workdir: ~/llmd-workspace

setup: |
  set -e
  MODEL_ID="${MODEL_ID:-meta-llama/Llama-2-7b-hf}"
  BACKEND="${BACKEND:-vllm}"

  # Install llm-d dependencies
  pip install kserve llm-d gateway-api

  if [ "$BACKEND" = "vllm" ]; then
    pip install -U vllm --pre \
      --index-url https://pypi.org/simple \
      --extra-index-url https://wheels.vllm.ai/nightly
  fi

  if [ "$BACKEND" = "sglang" ]; then
    pip install sglang
  fi

  if [ "$BACKEND" = "dynamo" ]; then
    pip install dynamo-ai
  fi

  # Pre-download model weights
  pip install huggingface-hub
  python3 -c "
  from huggingface_hub import snapshot_download
  import os
  token = os.environ.get('HF_TOKEN', '')
  snapshot_download(
      '${MODEL_ID}',
      local_dir='/models/weights',
      token=token if token else None,
      max_workers=8
  )
  print('Model weights downloaded successfully')
  "

run: |
  set -e
  MODEL_ID="${MODEL_ID:-meta-llama/Llama-2-7b-hf}"
  MODEL_NAME="${MODEL_NAME:-llmd-model}"
  TP_SIZE="${TP_SIZE:-1}"
  DP_SIZE="${DP_SIZE:-2}"
  GPU_MEM_UTIL="${GPU_MEM_UTIL:-0.90}"
  MAX_MODEL_LEN="${MAX_MODEL_LEN:-8192}"
  BACKEND="${BACKEND:-vllm}"
  PORT="${PORT:-8000}"

  echo "Deploying llm-d disaggregated inference endpoint"
  echo "Model: $MODEL_ID"
  echo "Backend: $BACKEND"
  echo "TP Size: $TP_SIZE | DP Size: $DP_SIZE"
  echo "Provider: $TERRADEV_PROVIDER"
  echo "Region: $TERRADEV_REGION"

  # Apply KServe LLMInferenceService manifest
  kubectl apply -f /llmd-k8s/llminferenceservice.yaml

  # Apply LeaderWorkerSet for distributed serving
  kubectl apply -f /llmd-k8s/leaderworkerset.yaml

  # Apply Gateway API Inference Extension
  kubectl apply -f /llmd-k8s/gateway.yaml

  echo "llm-d deployment complete"
  echo "Service: $MODEL_NAME"
  echo "Port: $PORT"

envs:
  MODEL_ID: "meta-llama/Llama-2-7b-hf"
  MODEL_NAME: "llmd-model"
  TP_SIZE: "1"
  DP_SIZE: "2"
  GPU_MEM_UTIL: "0.90"
  MAX_MODEL_LEN: "8192"
  BACKEND: "vllm"
  PORT: "8000"
  GPU_TYPE: "H100"
  GPU_COUNT: "2"
  CPU_COUNT: "48"
  MEMORY_GB: "256"
  DISK_SIZE_GB: "200"
  TERRADEV_PROVIDER: ""
  TERRADEV_GPU_TYPE: ""
  TERRADEV_REGION: ""
  TERRADEV_DEPLOYMENT_ID: ""
  HF_TOKEN: ""
  CUDA_VISIBLE_DEVICES: "0,1"
  NCCL_P2P_DISABLE: "0"
  NCCL_IB_DISABLE: "0"
  VLLM_ATTENTION_BACKEND: "FLASHINFER"
  VLLM_USE_DEEP_GEMM: "1"
  NIXL_ENABLED: "1"
  GATEWAY_API_ENABLED: "1"

service:
  port: 8000
  readiness_probe:
    path: /health
    initial_delay_seconds: 60
    period_seconds: 10
  replicas: 1

# llm-d scheduling hints
scheduling:
  prefer_nvlink: true
  min_gpu_memory_gb: 80
  min_nvlink_bandwidth_gbps: 450
  prefer_same_switch: true
  topology: multi_node
  disaggregated: true
  nixl_enabled: true
  gateway_api_enabled: true
