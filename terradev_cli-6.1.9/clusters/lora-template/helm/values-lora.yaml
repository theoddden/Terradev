# LoRA Template Helm Values
# Production-grade multi-tenant LoRA serving with vLLM

replicaCount: 2

image:
  repository: vllm/vllm-openai
  tag: latest
  pullPolicy: IfNotPresent

# Base model configuration
model:
  name: "meta-llama/Llama-2-7b-hf"
  tensorParallelSize: 1

# LoRA configuration
lora:
  enabled: true
  maxLoras: 8
  maxLoraRank: 64
  extraVocabSize: 256
  tunedConfigDir: "/adapter-configs"
  # Registry configuration
  registry:
    enabled: true
    path: "/data/lora_registry.db"

# vLLM performance optimizations
performance:
  # KV Cache Offloading
  kvOffloading:
    enabled: true
  # Speculative Decoding
  speculative:
    enabled: true
    method: "mtp"
  # Sleep Mode
  sleepMode:
    enabled: true
    devMode: true

# Resource configuration
resources:
  requests:
    nvidia.com/gpu: 1
    memory: "16Gi"
    cpu: "4"
  limits:
    nvidia.com/gpu: 1
    memory: "32Gi"
    cpu: "8"

# Storage configuration
storage:
  adapterStorage:
    size: 100Gi
    storageClass: gp2
    accessMode: ReadWriteMany
  registryStorage:
    size: 10Gi
    storageClass: gp2
    accessMode: ReadWriteOnce
  shm:
    size: 16Gi

# Node selector and tolerations
nodeSelector:
  accelerator: nvidia-tesla-a10g

tolerations:
- key: nvidia.com/gpu
  operator: Exists
  effect: NoSchedule

# Service configuration
service:
  type: ClusterIP
  port: 8000

# HPA configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Warm pool configuration
warmPool:
  enabled: true
  maxWarmModels: 10
  minWarmModels: 3
  enableAdapterAwareWarming: true
  maxWarmAdaptersPerReplica: 5

# Cost attribution
costAttribution:
  enabled: true
  gpuCostPerHour:
    a10g: 1.50
    a100: 3.50
    h100: 4.50
    l4: 0.80
  storageCostPerGbMonth: 0.10
