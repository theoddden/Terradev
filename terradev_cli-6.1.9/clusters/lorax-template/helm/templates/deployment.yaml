apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lorax.fullname" . }}
  labels:
    app: {{ include "lorax.name" . }}
    chart: {{ include "lorax.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "lorax.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "lorax.name" . }}
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "lorax.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: lorax
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
          protocol: TCP
        {{- end }}
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        {{- if .Values.storage.enabled }}
        - name: adapter-storage
          mountPath: /data
        {{- end }}
        command:
        - lorax-server
        args:
        - --model-id
        - {{ .Values.model.id }}
        - --max-loras
        - {{ .Values.maxLoras | quote }}
        {{- if ne .Values.model.quantization "none" }}
        - --quantize
        - {{ .Values.model.quantization }}
        {{- end }}
        - --port
        - {{ .Values.service.targetPort | quote }}
        {{- if .Values.metrics.enabled }}
        - --enable-metrics
        {{- end }}
      volumes:
      {{- if .Values.storage.enabled }}
      - name: adapter-storage
        persistentVolumeClaim:
          claimName: {{ include "lorax.fullname" . }}-storage
      {{- end }}
