provider: hyperstack
base_url: https://infrahub-api.nexgencloud.com/v1
auth_header: api_key
auth_required: true
last_verified: '2026-08-24'
endpoints:
- name: list_virtual_machines
  method: GET
  path: core/virtual-machines
  expected_response_fields:
  - status
  - instances
  optional_response_fields:
  - message
  - page
  - page_size
  - count
  expected_status: 200
- name: core_flavors
  method: GET
  path: core/flavors
  enabled: true
  expected_response_fields:
  - data
  optional_response_fields: []
  expected_status: 200
- name: core_virtual_machines
  method: POST
  path: core/virtual-machines
  enabled: false
  expected_response_fields: []
  optional_response_fields: []
  expected_status: 201
