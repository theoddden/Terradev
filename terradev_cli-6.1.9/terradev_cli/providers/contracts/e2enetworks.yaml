provider: e2enetworks
base_url: https://api.e2enetworks.com/myaccount/api/v1
auth_type: Bearer
auth_header: Authorization
auth_query_param: apikey
auth_required: true
last_verified: '2026-08-25'
endpoints:
- name: list_nodes
  method: GET
  path: nodes/
  enabled: true
  expected_status: 200
  query_params:
  - apikey
  - project_id
  - location
  expected_response_fields:
  - data
  optional_response_fields:
  - message
  - code
  - errors
- name: list_images
  method: GET
  path: images/saved-images/
  enabled: false
  note: Returns 412 Precondition Failed when the project has no saved image templates.
  expected_status: 200
  query_params:
  - apikey
  - project_id
  - location
  expected_response_fields:
  - data
  optional_response_fields:
  - message
  - code
  - errors
- name: list_os_categories
  method: GET
  path: images/os-category/
  enabled: true
  expected_status: 200
  query_params:
  - apikey
  - project_id
  - location
  expected_response_fields:
  - data
  optional_response_fields:
  - message
  - code
  - errors
- name: list_plans
  method: GET
  path: images/
  enabled: false
  expected_status: 200
  query_params:
  - apikey
  - project_id
  - location
  - name: category
    default: Distro
  - name: display_category
    default: Ubuntu
  - name: os
    default: Ubuntu
  - name: osversion
    default: '24.04'
  - name: billing_type
    default: hourly
  expected_response_fields:
  - data
  optional_response_fields:
  - message
  - code
  - errors
- name: create_node
  method: POST
  path: nodes/
  enabled: false
  expected_status: 201
  expected_response_fields:
  - data
  optional_response_fields:
  - message
  - code
  - errors
- name: delete_node
  method: DELETE
  path: nodes/{id}/
  enabled: false
  expected_status: 204
  expected_response_fields: []
  optional_response_fields: []
