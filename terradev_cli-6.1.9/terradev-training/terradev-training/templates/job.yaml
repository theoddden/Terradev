apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "terradev.fullname" . }}-{{ .Release.Revision }}
  labels:
    {{- include "terradev.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.backoffLimit | default 3 }}
  {{- if .Values.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  {{- end }}
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        {{- include "terradev.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: {{ .Values.restartPolicy | default "Never" }}
      serviceAccountName: {{ include "terradev.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.command }}
        command:
          {{- toYaml .Values.command | nindent 10 }}
        {{- end }}
        {{- if .Values.env }}
        envFrom:
        - configMapRef:
            name: {{ include "terradev.fullname" . }}-config
        {{- end }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if .Values.gpu.storage }}
        volumeMounts:
        - name: storage
          mountPath: /data
        {{- end }}
      {{- if .Values.gpu.storage }}
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: {{ include "terradev.fullname" . }}-storage
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}